    <circle cx="220" cy="260" r="20" fill="#F59E0B" />
    <circle cx="260" cy="260" r="20" fill="#FFFFFF" />
    <circle cx="300" cy="260" r="20" fill="#F59E0B" />
    <circle cx="340" cy="260" r="20" fill="#FFFFFF" />
    <circle cx="372" cy="260" r="20" fill="#F59E0B" />
    
    <!-- Doorway -->
    <path d="M226 400 L226 310 C226 295 240 285 256 285 C272 285 286 295 286 310 L286 400 Z" fill="#10B981" />
    
